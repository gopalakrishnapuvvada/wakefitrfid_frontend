name: Build Windows Single EXE

on:
  workflow_dispatch:
  push:
    branches: [ main, master, gopala ]
    tags: [ 'v*' ]

jobs:
  build-single-exe:
    name: Build Standalone Single Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. Setup Node.js & Build React Frontend
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies & Build
        run: |
          cd frontend
          npm ci
          npm run build

      # 2. Setup Python & Install Backend Dependencies
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pyinstaller

      # 3. Build Backend Executable with PyInstaller as a SINGLE standalone .exe file
      - name: Build Standalone Single EXE (PyInstaller)
        run: |
          cd backend
          pyinstaller --noconfirm --onefile --name "WakefitRFID_Server" `
            --add-data "../frontend/dist;frontend/dist" `
            --hidden-import uvicorn.logging `
            --hidden-import uvicorn.loops `
            --hidden-import uvicorn.loops.auto `
            --hidden-import uvicorn.protocols `
            --hidden-import uvicorn.protocols.http `
            --hidden-import uvicorn.protocols.http.auto `
            --hidden-import uvicorn.protocols.websockets `
            --hidden-import uvicorn.protocols.websockets.auto `
            --hidden-import uvicorn.lifespan `
            --hidden-import uvicorn.lifespan.on `
            --hidden-import openpyxl.reader.excel `
            --hidden-import python_multipart `
            main.py

      # 4. Upload GitHub Artifact (Single Standalone .exe)
      - name: Upload Single Windows EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WakefitRFID_Single_EXE
          path: backend/dist/WakefitRFID_Server.exe
          retention-days: 30
